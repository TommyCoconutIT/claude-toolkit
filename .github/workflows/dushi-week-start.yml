name: Dushi Week — Build Airtable Itinerary Tasks

# Triggered by the tommy-os portal on two events:
#   1. Immediately when a lead completes the quiz (lead-submitted Inngest job)
#   2. 10 minutes after email capture if the quiz is not yet complete (lead-captured Inngest job)
#
# Required GitHub secrets:
#   ANTHROPIC_API_KEY  — Anthropic API key for Claude
#   AIRTABLE_API_KEY   — Airtable Personal Access Token with base read/write on appFRLV1H76ohiIQS

on:
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: "Lead Pipeline record ID (starts with rec)"
        required: true
        type: string

jobs:
  build-itinerary:
    name: Build itinerary tasks for ${{ inputs.pipeline_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout claude-toolkit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone template itinerary (Steps 1–5, no AI)
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
          TEMPLATE_TRIP_NAME: ${{ vars.TEMPLATE_TRIP_NAME || 'Template — Master' }}
        run: python3 scripts/clone-template-itinerary.py

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate personalization suggestions (Step 6, AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
        run: |
          # Strip YAML frontmatter (---...---) from a skill file before including it
          strip_frontmatter() {
            awk 'BEGIN{s=0} /^---$/{s++; next} s>=2{print}' "$1"
          }

          VOICE=$(strip_frontmatter skills/tommy-coconut-voice/SKILL.md)
          SKILL=$(strip_frontmatter skills/dushi-week-airtable-tasks/SKILL.md)
          BUILDER=$(strip_frontmatter skills/dushi-week-builder-v2/SKILL.md)
          LESSONS=$(cat skills/dushi-week-builder/references/lessons-learned.md)
          ISLAND=$(cat skills/dushi-week-builder/references/island-database.md)

          {
            echo "# Itinerary Builder — Logic & Planning Guide"
            echo ""
            echo "${BUILDER}"
            echo ""
            echo "---"
            echo ""
            echo "# Lessons Learned"
            echo ""
            echo "> NOTE: This file was written for interactive HTML itinerary builds."
            echo "> In this run you are writing Airtable records, NOT producing HTML."
            echo "> Focus on: factual corrections to island data, scheduling rules, guest segment notes, the Obligation Rule, Cruise Ship Rule, and Copy 1/2 rules."
            echo "> Skip: HTML/CSS fixes, token replacement notes, microsite handoff steps, and delivery checklist items that reference HTML files."
            echo ""
            echo "${LESSONS}"
            echo ""
            echo "---"
            echo ""
            echo "# Island Database"
            echo ""
            echo "${ISLAND}"
            echo ""
            echo "---"
            echo ""
            echo "# Itinerary Task Builder — Airtable Write Instructions"
            echo ""
            echo "${SKILL}"
            echo ""
            echo "---"
            echo ""
            echo "# Tommy Coconut Voice Bible"
            echo ""
            echo "${VOICE}"
            echo ""
            echo "---"
            echo ""
            echo "## THIS RUN"
            echo ""
            echo "pipeline_id: ${PIPELINE_ID}"
            echo ""
            echo "Steps 1–5 are ALREADY COMPLETE. The clone script ran before this session and wrote all Itinerary Items V2 records 1:1 from the segment template (including Show About? and Show Base Pro Tip? checkboxes)."
            echo "Do NOT re-clone, delete, or rewrite Body Text. Start immediately at STEP 6 — read quiz answers and PATCH Custom Notes with [AI] personalization suggestions only."
            echo "You are running in fully automated mode triggered by the tommy-os portal. No human is present."
          } | claude --print --dangerously-skip-permissions --max-turns 40
